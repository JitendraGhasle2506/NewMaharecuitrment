<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Generated Tax Invoices</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
</head>
<body>
    <th:block th:replace="~{header/header :: var-sidebar-header('Invoice', 'Generated Tax Invoices', ~{::section})}">
        <section class="container-fluid py-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Generated Tax Invoices</h2>
                    <p class="text-muted mb-0">Open saved employee tax invoices to view or print them.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/invoice/tax-invoices/generate}">Create Invoice</a>
            </div>
            <form method="get" th:action="@{/invoice/tax-invoices/generate/invoices}" class="row g-2 align-items-end mb-3">
                <div class="col-12 col-md-3">
                    <label for="invoiceDepartment" class="form-label small text-muted mb-1">Department</label>
                    <select id="invoiceDepartment" name="departmentId" class="form-select">
                        <option value="">All Departments</option>
                        <option th:each="department : ${departments}" th:value="${department.id}"
                                th:text="${department.name}" th:selected="${department.id == departmentId}">Department</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label for="invoiceMonth" class="form-label small text-muted mb-1">Generated Month</label>
                    <select id="invoiceMonth" name="month" class="form-select">
                        <option value="">All Months</option>
                        <option th:each="entry : ${months}" th:value="${entry.key}" th:text="${entry.value}"
                                th:selected="${entry.key == month}">Month</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label for="invoiceYear" class="form-label small text-muted mb-1">Generated Year</label>
                    <select id="invoiceYear" name="year" class="form-select">
                        <option value="">All Years</option>
                        <option th:each="value : ${years}" th:value="${value}" th:text="${value}"
                                th:selected="${value == year}">Year</option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <label for="invoiceSearch" class="form-label small text-muted mb-1">Search</label>
                    <input id="invoiceSearch" type="search" name="search" th:value="${search}" class="form-control"
                           placeholder="Invoice number, request, project or recipient" maxlength="255">
                </div>
                <div class="col-12 col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-outline-primary flex-fill">Search</button>
                    <a class="btn btn-light flex-fill" th:href="@{/invoice/tax-invoices/generate/invoices}">Clear</a>
                </div>
            </form>
            <div class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr><th>Invoice Number</th><th>Invoice Date</th><th>Request / Project</th><th>Billed To</th>
                                <th>Billing Period</th><th class="text-end">Total (INR)</th><th class="text-end">Action</th></tr>
                        </thead>
                        <tbody>
                            <tr th:if="${invoices.empty}">
                                <td colspan="7" class="text-center text-muted py-5"
                                    th:text="${#strings.isEmpty(search) and departmentId == null and month == null and year == null ? 'No tax invoices have been generated yet.' : 'No invoices match your filters.'}"></td>
                            </tr>
                            <tr th:each="invoice : ${invoices.content}">
                                <td class="fw-semibold" th:text="${invoice.tiNumber}"></td>
                                <td th:text="${#temporals.format(invoice.tiDate, 'dd-MMM-yyyy')}"></td>
                                <td><div th:text="${invoice.requestId}"></div><div class="text-muted small" th:text="${invoice.projectName}"></div></td>
                                <td th:text="${invoice.billedTo}"></td>
                                <td><span th:text="${#temporals.format(invoice.periodStart, 'dd-MMM-yyyy')}"></span>
                                    to <span th:text="${#temporals.format(invoice.periodEnd, 'dd-MMM-yyyy')}"></span></td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(invoice.totalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                                <td class="text-end"><a class="btn btn-sm btn-outline-primary"
                                    th:href="@{/invoice/tax-invoices/generate/invoices/{id}(id=${invoice.id})}">View / Print</a></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                    <span class="text-muted small" th:text="${invoices.totalElements + ' invoice(s)'}"></span>
                    <nav aria-label="Invoice pages" class="d-flex align-items-center gap-3">
                        <a th:if="${invoices.hasPrevious()}" th:href="@{/invoice/tax-invoices/generate/invoices(page=${invoices.number - 1},search=${search},departmentId=${departmentId},month=${month},year=${year})}">Previous</a>
                        <span th:if="${invoices.totalPages > 0}" th:text="${'Page ' + (invoices.number + 1) + ' of ' + invoices.totalPages}"></span>
                        <a th:if="${invoices.hasNext()}" th:href="@{/invoice/tax-invoices/generate/invoices(page=${invoices.number + 1},search=${search},departmentId=${departmentId},month=${month},year=${year})}">Next</a>
                    </nav>
                </div>
            </div>
        </section>
    </th:block>
</body>
</html>
