# Reference Nginx configuration for the public TLS virtual host.
# Replace /maharecruitment when the deployed public context path is different.

map $request_uri $maharecruitment_frame_options {
    ~^/maharecruitment/invoice/tax-invoices/application/[^/]+/(new|preview)(/.*)?$ SAMEORIGIN;
    default DENY;
}

map $request_uri $maharecruitment_frame_ancestors {
    ~^/maharecruitment/invoice/tax-invoices/application/[^/]+/(new|preview)(/.*)?$ "frame-ancestors 'self';";
    default "frame-ancestors 'none';";
}

# Add these directives inside the HTTPS server block. `always` also covers
# redirects and error responses generated before a request reaches Java.
add_header X-XSS-Protection "0" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $maharecruitment_frame_options always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://code.jquery.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' data: https://cdn.jsdelivr.net https://unpkg.com; connect-src 'self' https://nominatim.openstreetmap.org; object-src 'none'; frame-src 'self'; base-uri 'self'; form-action 'self'; $maharecruitment_frame_ancestors" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Canonicalize the context root at the TLS edge. The servlet container otherwise
# creates this redirect before application filters can add response headers.
location = /maharecruitment {
    return 308 /maharecruitment/;
}

location /maharecruitment/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_pass http://maharecruitment_upstream;
}
