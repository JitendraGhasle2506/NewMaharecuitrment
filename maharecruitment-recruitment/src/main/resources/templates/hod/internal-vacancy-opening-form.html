<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Internal Resource Requirement Request</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
</head>

<body class="department-shell" th:attr="data-context-path=${contextPath}">
    <th:block th:replace="~{header/header :: var-sidebar-header('HOD', 'Internal Resource Requirement', ~{::section})}">
        <section>
            <div class="card add-emp-card">
                <div class="header">
                    <h2 th:text="${isEdit ? 'Edit Resource Requirement Request' : 'Raise Resource Requirement Request'}"></h2>
                </div>

                <div class="card-body">
                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                    <div class="alert alert-warning" th:if="${#lists.isEmpty(projectOptions)}">
                        No internal projects are available.
                    </div>

                    <form id="internalVacancyOpeningForm"
                        th:action="@{/hod1/internal-vacancies}"
                        th:object="${openingForm}"
                        method="post">
                        <input type="hidden" th:field="*{internalVacancyOpeningId}">
                        <input type="hidden" th:field="*{currentStatus}">

                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Project Name <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{projectId}">
                                    <option value="">Select Project</option>
                                    <option th:each="project : ${projectOptions}"
                                            th:value="${project.projectId}"
                                            th:text="${project.projectName}"></option>
                                </select>
                                <div class="text-danger small" th:errors="*{projectId}"></div>
                            </div>
                        </div>

                        <div class="row g-3 mt-1">
                            <div class="col-md-12">
                                <label class="form-label">Remarks / Justification</label>
                                <textarea class="form-control" th:field="*{remarks}" maxlength="1000" rows="3" placeholder="Provide reason for this resource requirement..."></textarea>
                                <div class="text-danger small" th:errors="*{remarks}"></div>
                            </div>
                        </div>

                        <hr class="my-4">
                        <h5>Designation Requirements</h5>

                        <div class="row g-3 align-items-end">
                            <div class="col-md-5">
                                <label class="form-label">Designation <span class="text-danger">*</span></label>
                                <select id="designationSelect" class="form-select">
                                    <option value="">Select Designation</option>
                                    <option th:each="designation : ${designationOptions}"
                                            th:value="${designation.designationId}"
                                            th:text="${designation.designationName}"></option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">Level <span class="text-danger">*</span></label>
                                <select id="levelSelect" class="form-select">
                                    <option value="">Select Level</option>
                                </select>
                            </div>
                            <div class="col-md-2 d-grid">
                                <button type="button" class="btn btn-primary" id="addRequirementButton">Add Row</button>
                            </div>
                        </div>

                        <div class="text-danger small mt-2" th:if="${#fields.hasErrors('requirements')}" th:errors="*{requirements}"></div>

                        <div class="table-responsive mt-3">
                            <table class="table table-bordered align-middle" id="internalRequirementTable">
                                <thead>
                                    <tr>
                                        <th>Designation</th>
                                        <th>Level</th>
                                        <th>Vacancies Required</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="requirement, stat : *{requirements}"
                                        th:attr="data-row-key=${requirement.designationId + '_' + requirement.levelCode}">
                                        <td>
                                            <span th:text="${requirement.designationName}"></span>
                                            <input type="hidden" data-field="designationId"
                                                th:name="${'requirements[' + stat.index + '].designationId'}"
                                                th:value="${requirement.designationId}">
                                            <input type="hidden" data-field="designationName"
                                                th:name="${'requirements[' + stat.index + '].designationName'}"
                                                th:value="${requirement.designationName}">
                                        </td>
                                        <td>
                                            <span th:text="${requirement.levelName}"></span>
                                            <input type="hidden" data-field="levelCode"
                                                th:name="${'requirements[' + stat.index + '].levelCode'}"
                                                th:value="${requirement.levelCode}">
                                            <input type="hidden" data-field="levelName"
                                                th:name="${'requirements[' + stat.index + '].levelName'}"
                                                th:value="${requirement.levelName}">
                                        </td>
                                        <td>
                                            <input type="number" min="1" class="form-control numberOfVacancyInput"
                                                data-field="numberOfVacancy"
                                                th:name="${'requirements[' + stat.index + '].numberOfVacancy'}"
                                                th:value="${requirement.numberOfVacancy}">
                                        </td>
                                        <td>
                                            <button type="button" class="btn btn-outline-danger btn-sm removeRequirementButton">Remove</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="mt-4 d-flex justify-content-center gap-2">
                            <button type="submit" name="action" value="draft" class="btn btn-outline-primary">Save Draft</button>
                            <button type="submit" name="action" value="submit" class="btn btn-primary">Submit to HR</button>
                            <a class="btn btn-secondary" th:href="@{/hod1/internal-vacancies}">Back to List</a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </th:block>

    <script>
        // Inline script or reuse HR script with adjusted paths
        document.addEventListener('DOMContentLoaded', function() {
            const contextPath = document.body.getAttribute('data-context-path') || '';
            const designationSelect = document.getElementById('designationSelect');
            const levelSelect = document.getElementById('levelSelect');
            const addBtn = document.getElementById('addRequirementButton');
            const tableBody = document.querySelector('#internalRequirementTable tbody');

            designationSelect.addEventListener('change', function() {
                const designationId = this.value;
                levelSelect.innerHTML = '<option value="">Select Level</option>';
                if (!designationId) return;

                fetch(`${contextPath}/hod1/internal-vacancies/by-designation/${designationId}`)
                    .then(res => res.json())
                    .then(data => {
                        data.forEach(level => {
                            const opt = document.createElement('option');
                            opt.value = level.levelCode;
                            opt.textContent = level.levelName;
                            levelSelect.appendChild(opt);
                        });
                    });
            });

            addBtn.addEventListener('click', function() {
                const dId = designationSelect.value;
                const dName = designationSelect.options[designationSelect.selectedIndex].text;
                const lCode = levelSelect.value;
                const lName = levelSelect.options[levelSelect.selectedIndex].text;

                if (!dId || !lCode) {
                    alert('Please select both designation and level.');
                    return;
                }

                const key = `${dId}_${lCode}`;
                if (document.querySelector(`tr[data-row-key="${key}"]`)) {
                    alert('This designation and level combination is already added.');
                    return;
                }

                const index = tableBody.rows.length;
                const row = document.createElement('tr');
                row.setAttribute('data-row-key', key);
                row.innerHTML = `
                    <td>
                        <span>${dName}</span>
                        <input type="hidden" name="requirements[${index}].designationId" value="${dId}">
                        <input type="hidden" name="requirements[${index}].designationName" value="${dName}">
                    </td>
                    <td>
                        <span>${lName}</span>
                        <input type="hidden" name="requirements[${index}].levelCode" value="${lCode}">
                        <input type="hidden" name="requirements[${index}].levelName" value="${lName}">
                    </td>
                    <td>
                        <input type="number" min="1" class="form-control" name="requirements[${index}].numberOfVacancy" value="1">
                    </td>
                    <td>
                        <button type="button" class="btn btn-outline-danger btn-sm removeRequirementButton">Remove</button>
                    </td>
                `;
                tableBody.appendChild(row);
                
                row.querySelector('.removeRequirementButton').addEventListener('click', function() {
                    row.remove();
                    reindexRows();
                });
            });

            document.querySelectorAll('.removeRequirementButton').forEach(btn => {
                btn.addEventListener('click', function() {
                    this.closest('tr').remove();
                    reindexRows();
                });
            });

            function reindexRows() {
                Array.from(tableBody.rows).forEach((row, index) => {
                    row.querySelectorAll('input').forEach(input => {
                        const name = input.getAttribute('name');
                        if (name) {
                            input.setAttribute('name', name.replace(/requirements\[\d+\]/, `requirements[${index}]`));
                        }
                    });
                });
            }
        });
    </script>
</body>

</html>
