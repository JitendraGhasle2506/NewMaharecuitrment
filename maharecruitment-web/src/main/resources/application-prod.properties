spring.datasource.url=jdbc:postgresql://localhost:5432/Demo
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.show-sql=true
registration.department.otp-bypass-enabled=false
registration.department.mobile-otp-enabled=true
registration.department.email-otp-enabled=true
app.service.sms-enabled=false
app.service.email-enabled=${NOTIFICATION_EMAIL_ENABLED:true}



logging.level.root=INFO
logging.level.com.maharecruitment.gov.in=INFO
logging.level.com.project=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.transaction=INFO
logging.level.com.fasterxml.jackson=INFO
logging.file.path=${MAHARECRUITMENT_LOG_PATH:${user.home}/maharecruitment/logs/prod}
app.security.cookie.secure=true
app.security.cookie.same-site=Lax
app.security.transport.require-https=true
app.security.transport.allow-loopback-http=false
server.servlet.session.cookie.secure=${app.security.cookie.secure}
server.servlet.session.cookie.same-site=${app.security.cookie.same-site}
