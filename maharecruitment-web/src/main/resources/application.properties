app.security.transport.trust-forwarded-headers=${APP_SECURITY_TRUST_FORWARDED_HEADERS:false}
app.base-url=${APP_BASE_URL:https://portal.example.gov.in/maharecruitment-web}

app.mobile-auth.issuer=${MOBILE_AUTH_JWT_ISSUER:maharecruitment-mobile}
app.mobile-auth.access-token-ttl=${MOBILE_AUTH_ACCESS_TOKEN_TTL:30m}
app.mobile-auth.refresh-token-ttl=${MOBILE_AUTH_REFRESH_TOKEN_TTL:30d}
app.mobile-auth.jwt-secret=${MOBILE_AUTH_JWT_SECRET:}

security.host-validation.enabled=${SECURITY_HOST_VALIDATION_ENABLED:false}
security.allowed-hosts[0]=${SECURITY_ALLOWED_HOST_PORTAL:103.5.84.215}
security.allowed-hosts[1]=${SECURITY_ALLOWED_HOST_WWW:www.portal.example.gov.in}
security.allowed-hosts[2]=${SECURITY_ALLOWED_HOST_LOCAL:localhost}
security.allowed-hosts[3]=${SECURITY_ALLOWED_HOST_LOOPBACK:127.0.0.1}
security.allowed-hosts[4]=${SECURITY_ALLOWED_HOST_SERVER:}
security.allowed-ports[0]=${SECURITY_ALLOWED_PORT_HTTP:80}
security.allowed-ports[1]=${SECURITY_ALLOWED_PORT_HTTPS:443}
security.allowed-ports[2]=${SECURITY_ALLOWED_PORT_LOCAL_HTTP:8777}
security.allowed-ports[3]=${SECURITY_ALLOWED_PORT_LOCAL_HTTPS:8443}
security.allowed-ports[4]=${SECURITY_ALLOWED_PORT_WILDFLY_HTTP:8080}

spring.jpa.properties.hibernate.format_sql=true

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false


server.forward-headers-strategy=none
server.servlet.session.cookie.http-only=${app.security.cookie.http-only}
server.servlet.session.cookie.same-site=${app.security.cookie.same-site}
server.servlet.session.cookie.secure=${app.security.cookie.secure}

# Disable Thymeleaf cache (optional)
spring.thymeleaf.cache=false


# Maximum file size
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Tomcat connector-level POST body limit (must be >= max-request-size, default is 2MB)
server.tomcat.max-http-form-post-size=50MB
# Compatibility key used by some Tomcat/Spring Boot combinations.
server.tomcat.max-http-post-size=50MB
# Tomcat 4 defaults that commonly reject larger multipart forms.
server.tomcat.max-swallow-size=50MB
server.tomcat.max-part-count=200

logging.level.com.fasterxml.jackson=INFO
#logging.level.org.springframework.transaction=INFO
#logging.level.root=INFO
logging.file.path=${MAHARECRUITMENT_LOG_PATH:${user.home}/maharecruitment/logs/default}
spring.mvc.log-request-details=false

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


