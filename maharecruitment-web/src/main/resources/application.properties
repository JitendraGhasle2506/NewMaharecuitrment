spring.application.name=maharecruitment-parent
server.port=8777
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/maharecruitment}

spring.profiles.default=local

# CORS is not enabled. Set true only with an explicit, least-privilege CORS configuration.
app.security.http-methods.allow-options=${APP_SECURITY_HTTP_METHODS_ALLOW_OPTIONS:false}

app.security.cookie.secure=${APP_SECURITY_COOKIE_SECURE:true}
app.security.cookie.http-only=true
app.security.cookie.same-site=Lax
app.security.transport.require-https=${APP_SECURITY_REQUIRE_HTTPS:false}
