<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Map Employee to Project</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
    <link rel="stylesheet" th:href="@{/css/employee-location-mapping.css}">
</head>

<body class="hr-shell">
    <th:block th:replace="~{header/header :: var-sidebar-header('HR', 'Employee Project Mapping', ~{::section})}">
        <section>
            <div class="card employee-location-card">
                <div class="header employee-location-page-header">
                    <div class="employee-location-heading">
                        <h2>Map Employee to Project</h2>
                        <div class="employee-location-page-meta">
                            <span><i class="fa-solid fa-user"></i><span th:text="${editView.employee.fullName}">Employee</span></span>
                            <span><i class="fa-solid fa-envelope"></i><span th:text="${editView.employee.email}">Email</span></span>
                        </div>
                    </div>
                    <a class="btn btn-outline-secondary btn-sm" th:href="${backUrl}">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back
                    </a>
                </div>

                <div class="card-body">
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <div class="row g-4">
                        <div class="col-lg-4">
                            <div class="border rounded p-3 h-100">
                                <div class="small text-muted mb-1">Employee</div>
                                <h5 class="mb-2" th:text="${editView.employee.fullName}">Employee Name</h5>
                                <div class="small mb-2" th:text="${editView.employee.designation + ' | ' + editView.employee.department}">Details</div>
                                <span class="badge bg-secondary" th:text="${editView.employee.recruitmentType}">Type</span>
                            </div>
                        </div>

                        <div class="col-lg-8">
                            <form autocomplete="off" method="post" th:object="${mappingForm}"
                                th:action="@{/hr/employee-project-mappings/{employeeId}(employeeId=${editView.employee.employeeId})}">
                                <input autocomplete="off" type="hidden" th:if="${_csrf != null}"
                                    th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input autocomplete="off" type="hidden" name="type" th:value="${currentType}">
                                <input autocomplete="off" type="hidden" name="search" th:value="${searchTerm}">
                                <input autocomplete="off" type="hidden" name="page" th:value="${currentPage}">
                                <input autocomplete="off" type="hidden" name="size" th:value="${pageSize}">
                                <input autocomplete="off" type="hidden" name="filterProjectId" th:value="${filterProjectId}">
                                <input autocomplete="off" type="hidden" name="source" th:value="${source}">

                                <div class="alert alert-info py-2">
                                    <i class="fa-solid fa-circle-info me-1"></i>
                                    <span th:text="${editView.requiredScope == 'EXTERNAL' ? 'Only external projects from the employee department or subdepartment are available.' : 'Only internal projects from the employee department or subdepartment are available.'}">
                                        Project scope rule
                                    </span>
                                </div>

                                <label class="form-label" for="employeeProjectId">Project <span class="text-danger">*</span></label>
                                <select autocomplete="off" id="employeeProjectId" class="form-select" th:field="*{projectId}" required>
                                    <option value="">Select Project</option>
                                    <option th:each="project : ${editView.availableProjects}"
                                        th:value="${project.projectId}"
                                        th:text="${project.displayName}"
                                        th:disabled="${!project.active}">Project</option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('projectId')}" th:errors="*{projectId}"></div>

                                <div class="mt-3" th:if="${editView.selectedProject != null}">
                                    <span class="small text-muted">Current mapping:</span>
                                    <strong th:text="${editView.selectedProject.displayName}">Current Project</strong>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4">
                                    <a class="btn btn-outline-secondary" th:href="${backUrl}">Cancel</a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fa-solid fa-floppy-disk me-1"></i> Save Project Mapping
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </th:block>
</body>
</html>
