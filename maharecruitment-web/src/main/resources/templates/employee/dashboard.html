<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
    <link rel="stylesheet" th:href="@{/css/employee-dashboard.css}" />
</head>

<body class="employee-dashboard-page">
    <th:block th:replace="~{header/header :: var-sidebar-header('Employee', 'Employee Dashboard', ~{::section})}">
        <section class="employee-dashboard">

            <div class="dashboard-intro">
                <div>
                    <span class="dashboard-kicker">MahaIT Recruitment</span>
                    <h2 th:text="${pageHeading}">Employee Dashboard</h2>
                    <p th:text="${pageSubtitle}">View your employee profile and attendance calendar.</p>
                </div>
                <div class="completion-meter" th:attr="data-completion=${profile.completionPercentage}"
                    th:style="'--completion:' + ${profile.completionPercentage}">
                    <span id="completionValue" th:text="${profile.completionPercentage + '%'}">0%</span>
                    <small>Profile Completion</small>
                </div>
            </div>

            <div class="profile-grid">
                <article class="profile-card">
                    <div class="profile-photo-wrap">
                        <img id="profilePhoto"
                            th:if="${loggedInUser != null and loggedInUser.photoPath != null and !#strings.isEmpty(loggedInUser.photoPath)}"
                            th:src="@{${loggedInUser.photoPath}}" alt="Employee profile photo">
                        <div id="profilePhotoFallback"
                            th:classappend="${loggedInUser != null and loggedInUser.photoPath != null and !#strings.isEmpty(loggedInUser.photoPath)} ? ' d-none' : ''"
                            class="profile-photo-fallback">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>
                    <div class="profile-main">
                        <span id="profileStatus" class="profile-status"
                            th:text="${profile.profileAvailable ? 'Profile available' : 'Complete your profile'}">
                            Complete your profile
                        </span>
                        <h3 id="summaryFullName" th:text="${#strings.isEmpty(profile.fullName) ? 'Employee' : profile.fullName}">
                            Employee
                        </h3>
                        <div class="profile-code">
                            <i class="fa-solid fa-id-badge"></i>
                            <span id="summaryEmployeeCode" th:text="${#strings.isEmpty(profile.employeeCode) ? '-' : profile.employeeCode}">-</span>
                        </div>
                    </div>
                    <dl class="profile-facts">
                        <div>
                            <dt>Role</dt>
                            <dd id="summaryRole" th:text="${#strings.isEmpty(profile.role) ? '-' : profile.role}">-</dd>
                        </div>
                        <div>
                            <dt>Department</dt>
                            <dd id="summaryDepartment" th:text="${#strings.isEmpty(profile.department) ? '-' : profile.department}">-</dd>
                        </div>
                        <div>
                            <dt>Email</dt>
                            <dd id="summaryEmail" th:text="${#strings.isEmpty(profile.email) ? '-' : profile.email}">-</dd>
                        </div>
                        <div>
                            <dt>Mobile / Alternate</dt>
                            <dd>
                                <span id="summaryMobile" th:text="${#strings.isEmpty(profile.mobileNo) ? '-' : profile.mobileNo}">-</span>
                                <span id="summaryAltMobile"
                                    th:text="${#strings.isEmpty(profile.alternateMobileNo) ? '' : ' / ' + profile.alternateMobileNo}"></span>
                            </dd>
                        </div>
                    </dl>
                </article>

                <div class="quick-actions">
                    <a class="quick-action" th:href="@{/employee/profile/update}">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>Update Profile</span>
                    </a>
                    <a class="quick-action" th:href="@{/employee/attendance-calendar}">
                        <i class="fa-solid fa-calendar-days"></i>
                        <span>Calendar</span>
                    </a>
                </div>
            </div>
        </section>
    </th:block>
</body>

</html>
