<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
    <style>
        .employee-empty-page .profile-shell {
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            background: linear-gradient(135deg, #f8fbff 0%, #eef6ff 100%);
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            padding: 40px 32px;
        }

        .employee-empty-page .profile-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1d4ed8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 18px;
        }

        .employee-empty-page .profile-copy {
            max-width: 60ch;
            color: #475569;
            line-height: 1.65;
        }
    </style>
</head>

<body class="employee-empty-page">
    <th:block th:replace="~{header/header :: var-sidebar-header('Employee', 'My Profile', ~{::section})}">
        <section>
            <div class="card add-emp-card">
                <div class="header">
                    <h2 class="mb-0" th:text="${pageHeading != null ? pageHeading : 'My Profile'}">My Profile</h2>
                </div>
                <div class="card-body">
                    <div class="profile-shell">
                        <div class="profile-icon">
                            <i class="fa-solid fa-id-card"></i>
                        </div>
                        <h3 class="mb-3">Profile not available</h3>
                        <p class="profile-copy mb-3"
                            th:text="${pageSubtitle != null ? pageSubtitle : 'Your confirmed employee profile is not available yet.'}">
                            Your confirmed employee profile is not available yet.
                        </p>
                        <div th:if="${errorMessage}" class="alert alert-warning mb-0" th:text="${errorMessage}">
                            Employee profile is not available.
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </th:block>
</body>

</html>
