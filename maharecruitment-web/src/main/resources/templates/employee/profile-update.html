<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Update Employee Profile</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
    <link rel="stylesheet" th:href="@{/css/employee-dashboard.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/sweetalert2/sweetalert2.min.css}" />
    <script th:src="@{/assets/vendor/sweetalert2/sweetalert2.all.min.js}"></script>
</head>

<body class="employee-dashboard-page employee-profile-update-page">
    <th:block th:replace="~{header/header :: var-sidebar-header('Employee', 'Update Profile', ~{::section})}">
        <section class="employee-dashboard"
            th:attr="data-save-url=@{/employee/profile/update},
                     data-photo-upload-url=@{/employee/profile/photo/upload},
                     data-photo-url=@{/employee/profile/photo}">
            <input autocomplete="off" type="hidden" id="csrfToken" th:if="${_csrf != null}" th:value="${_csrf.token}" />
            <input autocomplete="off" type="hidden" id="csrfHeader" th:if="${_csrf != null}" th:value="${_csrf.headerName}" />

            <div class="dashboard-intro">
                <div>
                    <a class="dashboard-back-link" th:href="@{/employee/dashboard}">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back to Dashboard
                    </a>
                    <span class="dashboard-kicker">MahaIT Recruitment</span>
                    <h2 th:text="${pageHeading}">Update Profile</h2>
                    <p th:text="${pageSubtitle}">View and update your personal information.</p>
                </div>
                <div class="completion-meter" th:attr="data-completion=${profile.completionPercentage}"
                    th:style="'--completion:' + ${profile.completionPercentage}">
                    <span id="completionValue" th:text="${profile.completionPercentage + '%'}">0%</span>
                    <small>Profile Completion</small>
                </div>
            </div>

            <div class="dashboard-panels">
                <article id="personalInfoForm" class="edit-panel">
                    <div class="panel-heading">
                        <div>
                            <span>Editable Details</span>
                            <h3>Personal Information</h3>
                        </div>
                    </div>

                    <form autocomplete="off" id="employeeProfileForm" novalidate
                        data-encrypt-sensitive="true" data-sensitive-purpose="EMPLOYEE_PROFILE"
                        data-sensitive-values-required="false"
                        th:attr="data-sensitive-key-url=@{/security/credential-encryption/public-key}">
                        <div class="form-grid read-only-grid">
                            <label>
                                Full Name
                                <input autocomplete="off" type="text" th:value="${profile.fullName}" readonly disabled>
                            </label>
                            <label>
                                Email
                                <input autocomplete="off" type="email" th:value="${profile.email}" readonly disabled>
                            </label>
                            <label>
                                Employee Code
                                <input autocomplete="off" type="text" th:value="${profile.employeeCode}" readonly disabled>
                            </label>
                        </div>

                        <div class="form-grid">
                            <label>
                                Date of Birth
                                <input autocomplete="off" name="dob" type="date" th:value="${profile.dob}">
                                <small class="field-error" data-error-for="dob"></small>
                            </label>
                            <label>
                                Gender
                                <select autocomplete="off" name="gender">
                                    <option value="">Select</option>
                                    <option value="Male" th:selected="${profile.gender == 'Male'}">Male</option>
                                    <option value="Female" th:selected="${profile.gender == 'Female'}">Female</option>
                                    <option value="Other" th:selected="${profile.gender == 'Other'}">Other</option>
                                </select>
                                <small class="field-error" data-error-for="gender"></small>
                            </label>
                            <label>
                                Mobile Number
                                <input autocomplete="off" name="mobileNo" type="tel" maxlength="15" th:value="${profile.mobileNo}">
                                <small class="field-error" data-error-for="mobileNo"></small>
                            </label>
                            <label>
                                Alternate Mobile
                                <input autocomplete="off" name="alternateMobileNo" type="tel" maxlength="15"
                                    th:value="${profile.alternateMobileNo}">
                                <small class="field-error" data-error-for="alternateMobileNo"></small>
                            </label>
                            <label>
                                PAN Number
                                <input autocomplete="off" id="panNo" type="password" maxlength="10"
                                    data-sensitive-encrypted-name="panNoEncrypted" data-sensitive-field="panNo"
                                    th:placeholder="${#strings.isEmpty(profile.panNo) ? 'ABCDE1234F' : profile.panNo + ' (leave blank to keep)'}">
                                <small class="field-error" data-error-for="panNo"></small>
                            </label>
                            <label>
                                Marital Status
                                <select autocomplete="off" id="maritalStatus" name="maritalStatus">
                                    <option value="">Select</option>
                                    <option value="Single" th:selected="${profile.maritalStatus == 'Single'}">Single</option>
                                    <option value="Married" th:selected="${profile.maritalStatus == 'Married'}">Married</option>
                                    <option value="Other" th:selected="${profile.maritalStatus == 'Other'}">Other</option>
                                </select>
                                <small class="field-error" data-error-for="maritalStatus"></small>
                            </label>
                            <div id="marriageDetails" class="marriage-details"
                                th:hidden="${profile.maritalStatus != 'Married'}">
                                <label>
                                    Spouse / Partner Name
                                    <input autocomplete="off" name="spouseName" type="text" maxlength="100"
                                        th:value="${profile.spouseName}"
                                        th:disabled="${profile.maritalStatus != 'Married'}">
                                    <small class="field-error" data-error-for="spouseName"></small>
                                </label>
                                <label>
                                    Marriage Date
                                    <input autocomplete="off" name="marriageDate" type="date"
                                        th:value="${profile.marriageDate}"
                                        th:disabled="${profile.maritalStatus != 'Married'}">
                                    <small class="field-error" data-error-for="marriageDate"></small>
                                </label>
                            </div>
                            <label>
                                Blood Group
                                <select autocomplete="off" name="bloodGroup">
                                    <option value="">Select</option>
                                    <option value="A+" th:selected="${profile.bloodGroup == 'A+'}">A+</option>
                                    <option value="A-" th:selected="${profile.bloodGroup == 'A-'}">A-</option>
                                    <option value="B+" th:selected="${profile.bloodGroup == 'B+'}">B+</option>
                                    <option value="B-" th:selected="${profile.bloodGroup == 'B-'}">B-</option>
                                    <option value="AB+" th:selected="${profile.bloodGroup == 'AB+'}">AB+</option>
                                    <option value="AB-" th:selected="${profile.bloodGroup == 'AB-'}">AB-</option>
                                    <option value="O+" th:selected="${profile.bloodGroup == 'O+'}">O+</option>
                                    <option value="O-" th:selected="${profile.bloodGroup == 'O-'}">O-</option>
                                </select>
                                <small class="field-error" data-error-for="bloodGroup"></small>
                            </label>
                            <label>
                                Emergency Contact Name
                                <input autocomplete="off" name="emergencyContactName" type="text"
                                    th:value="${profile.emergencyContactName}">
                                <small class="field-error" data-error-for="emergencyContactName"></small>
                            </label>
                            <label>
                                Emergency Contact Number
                                <input autocomplete="off" name="emergencyContactNo" type="tel" maxlength="15"
                                    th:value="${profile.emergencyContactNo}">
                                <small class="field-error" data-error-for="emergencyContactNo"></small>
                            </label>
                        </div>

                        <div id="addressFields" class="address-grid">
                            <label>
                                Current Address
                                <textarea autocomplete="off" name="currentAddress" rows="4"
                                    th:text="${profile.currentAddress}"></textarea>
                                <small class="field-error" data-error-for="currentAddress"></small>
                            </label>
                            <label>
                                Permanent Address
                                <textarea autocomplete="off" name="permanentAddress" rows="4"
                                    th:text="${profile.permanentAddress}"></textarea>
                                <small class="field-error" data-error-for="permanentAddress"></small>
                            </label>
                        </div>

                        <div class="form-actions">
                            <a class="btn btn-outline-secondary" th:href="@{/employee/dashboard}">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save Profile
                            </button>
                        </div>
                    </form>
                </article>

                <aside id="photoUploadCard" class="photo-upload-card">
                    <div class="panel-heading compact">
                        <div>
                            <span>Profile Photo</span>
                            <h3>Upload Photo</h3>
                        </div>
                    </div>
                    <div class="photo-preview">
                        <img id="photoPreview"
                            th:if="${loggedInUser != null and loggedInUser.photoPath != null and !#strings.isEmpty(loggedInUser.photoPath)}"
                            th:src="@{${loggedInUser.photoPath}}" alt="Selected profile photo">
                        <div id="photoPreviewFallback"
                            th:classappend="${loggedInUser != null and loggedInUser.photoPath != null and !#strings.isEmpty(loggedInUser.photoPath)} ? ' d-none' : ''">
                            <i class="fa-solid fa-image"></i>
                            <span>No photo selected</span>
                        </div>
                    </div>
                    <form autocomplete="off" id="photoUploadForm" method="post" enctype="multipart/form-data"
                        th:action="@{/employee/profile/photo/upload}" novalidate>
                        <input type="hidden" autocomplete="off" th:if="${_csrf != null}" th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}">
                        <input autocomplete="off" id="photoFile" name="file" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                        <small class="upload-note">JPG, JPEG, or PNG only. Maximum 2 MB.</small>
                        <small class="field-error" data-error-for="file"></small>
                        <button type="submit" class="btn btn-outline-primary w-100">
                            <i class="fa-solid fa-upload"></i>
                            Save Photo
                        </button>
                    </form>
                </aside>
            </div>
        </section>
    </th:block>
    <script th:src="@{/js/sensitive-data-encryption.js}"></script>
    <script th:src="@{/js/employee-dashboard.js(v='20260902')}"></script>
</body>

</html>
