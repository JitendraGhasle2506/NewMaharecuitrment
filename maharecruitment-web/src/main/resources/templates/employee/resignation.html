<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Submit Resignation</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pre-onboarding.css}" />
    <style>
        .resignation-card {
            margin-bottom: 2rem;
            border-radius: 22px;
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.06);
            background: #fff;
            padding: 30px;
        }
        .resignation-card h2 {
            color: #12344f;
            margin-bottom: 20px;
        }
        .resignation-card .form-group {
            margin-bottom: 20px;
        }
        .resignation-card label {
            font-weight: 600;
            color: #12344f;
            margin-bottom: 8px;
            display: block;
        }
    </style>
</head>

<body>
    <th:block th:replace="~{header/header :: var-sidebar-header('Employee', 'Resignation', ~{::section})}">
        <section>
            <div class="resignation-card">
                <h2>Submit Resignation</h2>
                
                <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
                
                <div th:if="${hasActiveResignation}" class="alert alert-warning" role="alert">
                    You have already submitted a resignation request or have an active relieving process.
                </div>
                
                <form autocomplete="off" th:if="${!hasActiveResignation}" th:action="@{/employee/resignation/submit}" th:object="${relievingDto}" method="post">
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="resignDate">Actual Resignation Date <span class="text-danger">*</span></label>
                            <input autocomplete="off" type="date" class="form-control" id="resignDate" th:field="*{resignDate}" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="requestedLastWorkingDate">Requested Last Working Date</label>
                            <input autocomplete="off" type="date" class="form-control" id="requestedLastWorkingDate" th:field="*{requestedLastWorkingDate}">
                            <small class="text-muted">Subject to HR and Management approval.</small>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12 form-group">
                            <label for="detailedReason">Primary Reason for Leaving</label>
                            <select autocomplete="off" class="form-select form-control" id="detailedReason" th:field="*{detailedReason}">
                                <option value="">Select Reason...</option>
                                <option value="Better Opportunity / Career Growth">Better Opportunity / Career Growth</option>
                                <option value="Relocation">Relocation</option>
                                <option value="Higher Education">Higher Education</option>
                                <option value="Health Reasons">Health Reasons</option>
                                <option value="Personal / Family Reasons">Personal / Family Reasons</option>
                                <option value="Dissatisfaction with Role / Salary">Dissatisfaction with Role / Salary</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="activeProjectsHandover">Active Projects / Proposed Handover</label>
                        <textarea autocomplete="off" class="form-control" id="activeProjectsHandover" th:field="*{activeProjectsHandover}" rows="3" placeholder="Briefly describe what you are currently working on and who might take it over..."></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="personalEmail">Personal Email <span class="text-danger">*</span></label>
                            <input autocomplete="off" type="email" class="form-control" id="personalEmail" th:field="*{personalEmail}" placeholder="For future communication" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="alternateMobile">Alternate Mobile Number</label>
                            <input autocomplete="off" type="text" class="form-control" id="alternateMobile" th:field="*{alternateMobile}" 
                                   maxlength="10" minlength="10" pattern="[0-9]{10}" title="Please enter exactly 10 digits"
                                   oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="forwardingAddress">Forwarding Address</label>
                        <textarea autocomplete="off" class="form-control" id="forwardingAddress" th:field="*{forwardingAddress}" rows="2" placeholder="For any physical documents (e.g., Form 16)"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="exitFeedback">Exit Feedback / Suggestions</label>
                        <textarea autocomplete="off" class="form-control" id="exitFeedback" th:field="*{exitFeedback}" rows="3" placeholder="Any feedback about your time with us..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="remarks">Additional Remarks</label>
                        <textarea autocomplete="off" class="form-control" id="remarks" th:field="*{remarks}" rows="2" placeholder="Optional details..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" onclick="return confirm('Are you sure you want to submit your resignation?')">Submit Resignation</button>
                </form>
            </div>
        </section>
    </th:block>
</body>
</html>
