<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>

<body class="portal-shell">
    <nav class="navbar navbar-expand-lg portal-nav">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-semibold" th:href="@{/login}">
                <span>MahaIT Recruitment</span>
            </a>
        </div>
    </nav>

    <main class="login-main">
        <div class="container login-con">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5">
                    <section class="auth-card">
                        <h2>Verify OTP</h2>
                        <p class="auth-subtext">Enter the six-digit OTP sent to your registered contact details.</p>

                        <div th:if="${passwordResetError}" class="alert alert-danger" th:text="${passwordResetError}"></div>
                        <div th:if="${passwordResetMessage}" class="alert alert-success" th:text="${passwordResetMessage}"></div>

                        <form autocomplete="off" id="passwordResetOtpForm" th:action="@{/forgot-password/verify-otp}" method="post" class="form-horizontal mb-3"
                            th:attr="data-expiry-seconds=${otpExpirySeconds},data-error-code=${passwordResetErrorCode},data-block-seconds=${passwordResetRetryAfterSeconds}">
                            <input autocomplete="off" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="form-group mb-3">
                                <label for="otp" class="control-label">OTP</label>
                                <input type="text" id="otp" name="otp" class="form-control"
                                    inputmode="numeric" minlength="6" maxlength="6" pattern="\d{6}"
                                    autocomplete="off" required
                                    oninput="this.value = this.value.replace(/[^0-9]/g, '');" />
                            </div>

                            <div class="form-group mb-3 d-grid">
                                <button type="submit" id="verifyPasswordResetOtpButton" class="btn btn-primary btn-login" data-submit-once disabled>Verify OTP</button>
                            </div>
                            <div id="passwordResetOtpValidity" class="otp-timing" aria-live="polite"></div>
                        </form>

                        <form autocomplete="off" th:action="@{/forgot-password/resend-otp}" method="post" class="form-horizontal mb-3">
                            <input autocomplete="off" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" id="resendOtpButton" class="btn btn-outline-primary w-100"
                                th:attr="data-cooldown-seconds=${otpResendCooldownSeconds}">Resend OTP</button>
                            <div id="resendOtpCountdown" class="otp-timing mt-2" aria-live="polite"></div>
                        </form>

                        <div class="form-group mb-0 d-grid">
                            <a th:href="@{/login}" class="btn btn-outline-secondary">Back to Login</a>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: var-footer}"></th:block>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var resendButton = document.getElementById("resendOtpButton");
            var countdown = document.getElementById("resendOtpCountdown");
            var otpForm = document.getElementById("passwordResetOtpForm");
            var otpInput = document.getElementById("otp");
            var verifyButton = document.getElementById("verifyPasswordResetOtpButton");
            var validity = document.getElementById("passwordResetOtpValidity");
            var errorCode = otpForm ? otpForm.dataset.errorCode || "" : "";
            var blockSeconds = otpForm ? parseInt(otpForm.dataset.blockSeconds || "0", 10) : 0;
            var cooldown = resendButton ? parseInt(resendButton.dataset.cooldownSeconds || "30", 10) : 0;
            var terminalCodes = ["OTP_EXPIRED", "OTP_ATTEMPTS_EXCEEDED", "OTP_TEMPORARILY_BLOCKED"];
            var otpActive = terminalCodes.indexOf(errorCode) < 0;
            var formatDuration = function (totalSeconds) {
                var seconds = Math.max(0, totalSeconds);
                return String(Math.floor(seconds / 60)).padStart(2, "0")
                    + ":" + String(seconds % 60).padStart(2, "0");
            };
            var updateVerifyButton = function () {
                verifyButton.disabled = !otpActive || !/^[0-9]{6}$/.test(otpInput.value.trim());
            };
            otpInput.addEventListener("input", function () {
                otpInput.value = otpInput.value.replace(/[^0-9]/g, "").slice(0, 6);
                updateVerifyButton();
            });

            var expiryRemaining = otpForm ? parseInt(otpForm.dataset.expirySeconds || "300", 10) : 0;
            if (otpActive && expiryRemaining > 0) {
                var expiryTick = function () {
                    validity.textContent = expiryRemaining > 0
                        ? "OTP valid for " + formatDuration(expiryRemaining)
                        : "OTP expired. Please request a new OTP.";
                    if (expiryRemaining <= 0) {
                        otpActive = false;
                        otpInput.value = "";
                        updateVerifyButton();
                        return;
                    }
                    expiryRemaining -= 1;
                    window.setTimeout(expiryTick, 1000);
                };
                expiryTick();
            }

            if (blockSeconds > 0) {
                cooldown = Math.max(cooldown, blockSeconds);
                otpActive = false;
                otpInput.value = "";
            }
            if (resendButton && cooldown > 0) {
                resendButton.disabled = true;
                var remaining = cooldown;
                var tick = function () {
                    countdown.textContent = remaining > 0 ? "Resend available in " + remaining + " seconds." : "";
                    if (remaining <= 0) {
                        resendButton.disabled = false;
                        return;
                    }
                    remaining -= 1;
                    window.setTimeout(tick, 1000);
                };
                tick();
            }
            updateVerifyButton();
        });

        document.addEventListener("submit", function (event) {
            var otpInput = document.getElementById("otp");
            if (event.target.action && event.target.action.indexOf("/resend-otp") !== -1 && otpInput) {
                otpInput.value = "";
            }
            var button = event.target.querySelector("[data-submit-once]");
            if (button) {
                button.disabled = true;
            }
        });
    </script>
</body>

</html>
