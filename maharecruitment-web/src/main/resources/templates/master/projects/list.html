<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
</head>

<body>
    <th:block th:replace="~{header/header :: var-sidebar-header('Master', 'Projects', ~{::section})}">
        <section>
            <div class="card add-emp-card">
                <div class="header d-flex justify-content-between align-items-center">
                    <h2>Project Master</h2>
                    <a class="btn btn-primary btn-sm" th:href="@{/master/projects/new}">Add Project</a>
                </div>

                <div class="card-body">
                    <div class="d-flex flex-wrap gap-2 mb-3">
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/resource-levels}">Resource Levels</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/designations}">Designations</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/designation-rates}">Designation Rates</a>
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/master/projects}">Projects</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/wings}">Wing Master</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/cell}">Cell Master</a>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form class="row g-2 mb-3 align-items-end" method="get" th:action="@{/master/projects}">
                        <div class="col-md-4">
                            <label class="form-label" for="cellId">Filter by Cell</label>
                            <select class="form-select form-select-sm" id="cellId" name="cellId">
                                <option value="">All Cells</option>
                                <option th:each="cell : ${availableCells}"
                                    th:value="${cell.cellId}"
                                    th:selected="${cellId != null and cellId == cell.cellId}"
                                    th:text="${cell.wingName != null ? cell.wingName + ' - ' + cell.cellName : cell.cellName}"></option>
                            </select>
                        </div>
                        <div class="col-auto form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="includeInactive" name="includeInactive"
                                value="true" th:checked="${includeInactive}">
                            <label class="form-check-label" for="includeInactive">Include inactive</label>
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-secondary btn-sm" type="submit">Apply</button>
                            <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/projects}">Clear</a>
                        </div>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Project Name</th>
                                    <!-- <th>Project Description</th> -->
                                    <th>Wing / Cell</th>
                                    <th>Project Type</th>
                                    <th>Status</th>
                                    <!-- <th>Project Scope</th> -->
                                    <!-- <th>Department Registration ID</th>
                                    <th>Application ID</th> -->
                                    <th class="text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${projects.isEmpty()}">
                                    <td colspan="6" class="text-center text-muted">No records found</td>
                                </tr>
                                <tr th:each="item : ${projects.content}">
                                    <td th:text="${item.projectId}"></td>
                                    <td th:text="${item.projectName}"></td>
                                    <!-- <td th:text="${item.projectDesc != null ? item.projectDesc : '-'}"></td> -->
                                    <td th:text="${item.cellName != null ? (item.wingName != null ? item.wingName + ' - ' + item.cellName : item.cellName) : '-'}"></td>
                                    <!-- <td th:text="${#strings.replace(item.projectType.name(), '_', ' ')}"></td> -->
                                    <td th:text="${#strings.capitalize(#strings.toLowerCase(item.projectScopeType.name()))}"></td>
                                    <td>
                                        <span class="badge"
                                            th:classappend="${item.activeFlag == 'Y'} ? ' text-bg-success' : ' text-bg-secondary'"
                                            th:text="${item.activeFlag == 'Y'} ? 'Active' : 'Inactive'"></span>
                                    </td>
                                    <!-- <td th:text="${item.departmentRegistrationId != null ? item.departmentRegistrationId : '-'}"></td>
                                    <td th:text="${item.applicationId != null ? item.applicationId : '-'}"></td> -->
                                    <td class="text-center">
                                        <a class="btn btn-outline-primary btn-sm"
                                            th:href="@{/master/projects/{id}/edit(id=${item.projectId})}">Edit</a>
                                        <form th:if="${item.activeFlag == 'Y'}" class="d-inline"
                                            th:action="@{/master/projects/{id}/deactivate(id=${item.projectId},cellId=${cellId},includeInactive=${includeInactive},page=${projects.number},size=${projects.size})}"
                                            method="post"
                                            onsubmit="return confirm('Are you sure you want to deactivate this project?');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button class="btn btn-outline-danger btn-sm" type="submit">Deactivate</button>
                                        </form>
                                        <form th:if="${item.activeFlag != 'Y'}" class="d-inline"
                                            th:action="@{/master/projects/{id}/restore(id=${item.projectId},cellId=${cellId},includeInactive=${includeInactive},page=${projects.number},size=${projects.size})}"
                                            method="post">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button class="btn btn-outline-success btn-sm" type="submit">Restore</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="app-pagination-shell"
                        th:if="${projects.totalPages > 1}"
                        th:with="middleStart=${projects.number - 2 > 1 ? projects.number - 2 : 1},
                                 middleEnd=${projects.number + 2 < projects.totalPages - 2 ? projects.number + 2 : projects.totalPages - 2},
                                 showingFrom=${projects.totalElements == 0 ? 0 : projects.number * projects.size + 1},
                                 showingTo=${projects.totalElements == 0 ? 0 : projects.number * projects.size + projects.numberOfElements}">
                        <div class="app-pagination-summary">
                            <div class="app-pagination-meta">
                                Showing <span th:text="${showingFrom}">1</span> to <span th:text="${showingTo}">10</span> of
                                <span th:text="${projects.totalElements}">10</span> entries
                            </div>
                            <div class="app-pagination-meta">
                                Page <span th:text="${projects.number + 1}">1</span> of <span th:text="${projects.totalPages}">1</span>
                            </div>
                        </div>
                        <nav aria-label="Project master pagination">
                            <ul class="pagination app-pagination mb-0">
                                <li class="page-item" th:classappend="${projects.first} ? ' disabled'">
                                    <a class="page-link" th:href="@{/master/projects(page=${projects.number - 1},size=${projects.size},cellId=${cellId},includeInactive=${includeInactive})}">Previous</a>
                                </li>
                                <li class="page-item" th:classappend="${projects.number == 0} ? ' active'">
                                    <a class="page-link" th:href="@{/master/projects(page=0,size=${projects.size},cellId=${cellId},includeInactive=${includeInactive})}">1</a>
                                </li>
                                <li class="page-item disabled" th:if="${middleStart > 1}">
                                    <span class="page-link app-pagination-ellipsis">...</span>
                                </li>
                                <th:block th:if="${middleStart <= middleEnd}">
                                    <li class="page-item" th:each="pageIndex : ${#numbers.sequence(middleStart, middleEnd)}"
                                        th:classappend="${pageIndex == projects.number} ? ' active'">
                                        <a class="page-link"
                                            th:href="@{/master/projects(page=${pageIndex},size=${projects.size},cellId=${cellId},includeInactive=${includeInactive})}"
                                            th:text="${pageIndex + 1}">2</a>
                                    </li>
                                </th:block>
                                <li class="page-item disabled" th:if="${middleEnd < projects.totalPages - 2}">
                                    <span class="page-link app-pagination-ellipsis">...</span>
                                </li>
                                <li class="page-item" th:if="${projects.totalPages > 1}"
                                    th:classappend="${projects.number == projects.totalPages - 1} ? ' active'">
                                    <a class="page-link"
                                        th:href="@{/master/projects(page=${projects.totalPages - 1},size=${projects.size},cellId=${cellId},includeInactive=${includeInactive})}"
                                        th:text="${projects.totalPages}">2</a>
                                </li>
                                <li class="page-item" th:classappend="${projects.last} ? ' disabled'">
                                    <a class="page-link" th:href="@{/master/projects(page=${projects.number + 1},size=${projects.size},cellId=${cellId},includeInactive=${includeInactive})}">Next</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
    </th:block>
</body>

</html>
