<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Edit Project' : 'Create Project'">Project Form</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
</head>

<body>
    <th:block th:replace="~{header/header :: var-sidebar-header('Master', 'Projects', ~{::section})}">
        <section>
            <div class="card add-emp-card">
                <div class="header">
                    <h2 th:text="${isEdit} ? 'Edit Project' : 'Create Project'"></h2>
                </div>
                <div class="card-body">
                    <div class="d-flex flex-wrap gap-2 mb-3">
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/resource-levels}">Resource Levels</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/designations}">Designations</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/designation-rates}">Designation Rates</a>
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/master/projects}">Projects</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/team-management}">Team Management</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/wings}">Wing Master</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/cell}">Cell Master</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/locations}">Location Master</a>
                    </div>

                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <form autocomplete="off" th:object="${projectForm}"
                        th:action="${isEdit} ? @{/master/projects/{id}(id=${projectId})} : @{/master/projects}"
                        th:attr="data-subdepartments-url=@{/master/projects/sub-departments}"
                        method="post"
                        class="row g-3">
                        <input autocomplete="off" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input autocomplete="off" type="hidden" th:field="*{projectType}">

                        <div class="col-md-6">
                            <label class="form-label">Project Name <span class="text-danger">*</span></label>
                            <input autocomplete="off" type="text" th:field="*{projectName}" class="form-control" maxlength="100">
                            <div class="text-danger small" th:if="${#fields.hasErrors('projectName')}" th:errors="*{projectName}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Project Code <span class="text-danger">*</span></label>
                            <input autocomplete="off" type="text" th:field="*{projectCode}" class="form-control text-uppercase" maxlength="30">
                            <div class="text-danger small" th:if="${#fields.hasErrors('projectCode')}" th:errors="*{projectCode}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Project Scope <span class="text-danger">*</span></label>
                            <select autocomplete="off" class="form-select" th:field="*{projectScopeType}">
                                <option value="">Select Project Scope</option>
                                <option th:each="scopeType : ${projectScopeTypes}"
                                    th:value="${scopeType}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(scopeType.name()))}"></option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('projectScopeType')}" th:errors="*{projectScopeType}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="departmentId">Department <span class="text-danger">*</span></label>
                            <select autocomplete="off" class="form-select" id="departmentId" th:field="*{departmentId}">
                                <option value="">Select Department</option>
                                <option th:each="department : ${availableDepartments}"
                                    th:value="${department.departmentId}"
                                    th:text="${department.departmentName}"></option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="subDepartmentId">Sub Department</label>
                            <select autocomplete="off" class="form-select" id="subDepartmentId" th:field="*{subDepartmentId}">
                                <option value="">Select Sub Department (optional)</option>
                                <option th:each="subDepartment : ${availableSubDepartments}"
                                    th:value="${subDepartment.subDeptId}"
                                    th:text="${subDepartment.subDeptName}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Cell <span class="text-danger">*</span></label>
                            <select autocomplete="off" class="form-select" th:field="*{cellId}">
                                <option value="">Select Cell</option>
                                <option th:each="cell : ${availableCells}"
                                    th:value="${cell.cellId}"
                                    th:text="${cell.wingName != null ? cell.wingName + ' - ' + cell.cellName : cell.cellName}"></option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('cellId')}" th:errors="*{cellId}"></div>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Project Description</label>
                            <textarea autocomplete="off" th:field="*{projectDesc}" class="form-control" maxlength="100" rows="3"></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('projectDesc')}" th:errors="*{projectDesc}"></div>
                        </div>

                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Update' : 'Save'"></button>
                            <a th:href="@{/master/projects}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </th:block>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const departmentSelect = document.getElementById('departmentId');
            const subDepartmentSelect = document.getElementById('subDepartmentId');
            const form = departmentSelect?.closest('form');
            const subDepartmentsUrl = form?.dataset.subdepartmentsUrl;
            if (!departmentSelect || !subDepartmentSelect || !subDepartmentsUrl) {
                return;
            }

            const renderSubDepartments = (items, selectedValue = '') => {
                subDepartmentSelect.innerHTML = '<option value="">Select Sub Department (optional)</option>';
                items.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.subDeptId;
                    option.textContent = item.subDeptName;
                    option.selected = String(item.subDeptId) === String(selectedValue);
                    subDepartmentSelect.appendChild(option);
                });
            };

            let requestSequence = 0;
            const loadSubDepartments = async departmentId => {
                const currentRequest = ++requestSequence;
                if (!departmentId) {
                    renderSubDepartments([]);
                    subDepartmentSelect.disabled = true;
                    return;
                }

                subDepartmentSelect.disabled = true;
                subDepartmentSelect.innerHTML = '<option value="">Loading...</option>';
                try {
                    const response = await fetch(
                        `${subDepartmentsUrl}?departmentId=${encodeURIComponent(departmentId)}`,
                        { headers: { 'X-Requested-With': 'XMLHttpRequest' } }
                    );
                    if (!response.ok) {
                        throw new Error('Unable to load sub-departments.');
                    }
                    const items = await response.json();
                    if (currentRequest === requestSequence) {
                        renderSubDepartments(items);
                        subDepartmentSelect.disabled = false;
                    }
                } catch (error) {
                    if (currentRequest === requestSequence) {
                        renderSubDepartments([]);
                        subDepartmentSelect.disabled = false;
                    }
                }
            };

            subDepartmentSelect.disabled = !departmentSelect.value;
            departmentSelect.addEventListener('change', event => loadSubDepartments(event.target.value));
        });
    </script>
</body>

</html>
