<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cell Master</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
</head>

<body>
    <th:block th:replace="~{header/header :: var-sidebar-header('Master', 'Cell Master', ~{::section})}">
        <section>
            <div class="card add-emp-card">
                <div class="header d-flex justify-content-between align-items-center">
                    <h2>Cell Master</h2>
                    <a class="btn btn-primary btn-sm" th:href="@{/master/cell/add}">Add New Cell</a>
                </div>

                <div class="card-body">
                    <div class="d-flex flex-wrap gap-2 mb-3">
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/resource-levels}">Resource Levels</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/designations}">Designations</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/designation-rates}">Designation Rates</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/projects}">Projects</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/wings}">Wing Master</a>
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/master/cell}">Cell Master</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/locations}">Location Master</a>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form class="row g-2 mb-3 align-items-end" method="get" th:action="@{/master/cell}">
                        <div class="col-md-3">
                            <label class="form-label" for="searchText">Search Cell Name</label>
                            <input class="form-control form-control-sm" type="text" id="searchText" name="searchText"
                                th:value="${searchText}" maxlength="100" placeholder="Enter cell name">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="wingId">Filter by Wing</label>
                            <select class="form-select form-select-sm" id="wingId" name="wingId">
                                <option value="">All Wings</option>
                                <option th:each="wing : ${availableWings}"
                                    th:value="${wing.wingId}"
                                    th:selected="${wingId != null and wingId == wing.wingId}"
                                    th:text="${wing.wingName}"></option>
                            </select>
                        </div>
                        <div class="col-auto form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="includeInactive" name="includeInactive"
                                value="true" th:checked="${includeInactive}">
                            <label class="form-check-label" for="includeInactive">Include inactive</label>
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-secondary btn-sm" type="submit">Apply</button>
                            <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/cell}">Clear</a>
                        </div>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Sr.No</th>
                                    <th>Wing Name</th>
                                    <th>Cell Name</th>
                                    <th>Status</th>
                                    <th class="text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${cells.isEmpty()}">
                                    <td colspan="5" class="text-center text-muted">No records found</td>
                                </tr>
                                <tr th:each="item, stat : ${cells.content}">
                                    <td th:text="${cells.number * cells.size + stat.count}">1</td>
                                    <td th:text="${item.wingName != null ? item.wingName : '-'}">Wing</td>
                                    <td th:text="${item.cellName}">Cell</td>
                                    <td>
                                        <span class="badge"
                                            th:classappend="${item.activeFlag == 'Y'} ? ' text-bg-success' : ' text-bg-secondary'"
                                            th:text="${item.activeFlag == 'Y'} ? 'Active' : 'Inactive'"></span>
                                    </td>
                                    <td class="text-center">
                                        <a class="btn btn-outline-primary btn-sm"
                                            th:href="@{/master/cell/edit/{id}(id=${item.cellId})}">Edit</a>
                                        <a class="btn btn-sm js-status-toggle"
                                            th:classappend="${item.activeFlag == 'Y'} ? ' btn-outline-danger' : ' btn-outline-success'"
                                            th:href="@{/master/cell/status/{id}(id=${item.cellId},wingId=${wingId},includeInactive=${includeInactive},searchText=${searchText},page=${cells.number},size=${cells.size})}"
                                            th:attr="data-status=${item.activeFlag == 'Y' ? 'deactivate' : 'activate'}"
                                            th:text="${item.activeFlag == 'Y'} ? 'Deactivate' : 'Activate'"></a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="app-pagination-shell"
                        th:if="${cells.totalPages > 1}"
                        th:with="middleStart=${cells.number - 2 > 1 ? cells.number - 2 : 1},
                                 middleEnd=${cells.number + 2 < cells.totalPages - 2 ? cells.number + 2 : cells.totalPages - 2},
                                 showingFrom=${cells.totalElements == 0 ? 0 : cells.number * cells.size + 1},
                                 showingTo=${cells.totalElements == 0 ? 0 : cells.number * cells.size + cells.numberOfElements}">
                        <div class="app-pagination-summary">
                            <div class="app-pagination-meta">
                                Showing <span th:text="${showingFrom}">1</span> to <span th:text="${showingTo}">10</span> of
                                <span th:text="${cells.totalElements}">10</span> entries
                            </div>
                            <div class="app-pagination-meta">
                                Page <span th:text="${cells.number + 1}">1</span> of <span th:text="${cells.totalPages}">1</span>
                            </div>
                        </div>
                        <nav aria-label="Cell master pagination">
                            <ul class="pagination app-pagination mb-0">
                                <li class="page-item" th:classappend="${cells.first} ? ' disabled'">
                                    <a class="page-link"
                                        th:href="@{/master/cell(page=${cells.number - 1},size=${cells.size},wingId=${wingId},includeInactive=${includeInactive},searchText=${searchText})}">Previous</a>
                                </li>
                                <li class="page-item" th:classappend="${cells.number == 0} ? ' active'">
                                    <a class="page-link"
                                        th:href="@{/master/cell(page=0,size=${cells.size},wingId=${wingId},includeInactive=${includeInactive},searchText=${searchText})}">1</a>
                                </li>
                                <li class="page-item disabled" th:if="${middleStart > 1}">
                                    <span class="page-link app-pagination-ellipsis">...</span>
                                </li>
                                <th:block th:if="${middleStart <= middleEnd}">
                                    <li class="page-item" th:each="pageIndex : ${#numbers.sequence(middleStart, middleEnd)}"
                                        th:classappend="${pageIndex == cells.number} ? ' active'">
                                        <a class="page-link"
                                            th:href="@{/master/cell(page=${pageIndex},size=${cells.size},wingId=${wingId},includeInactive=${includeInactive},searchText=${searchText})}"
                                            th:text="${pageIndex + 1}">2</a>
                                    </li>
                                </th:block>
                                <li class="page-item disabled" th:if="${middleEnd < cells.totalPages - 2}">
                                    <span class="page-link app-pagination-ellipsis">...</span>
                                </li>
                                <li class="page-item" th:if="${cells.totalPages > 1}"
                                    th:classappend="${cells.number == cells.totalPages - 1} ? ' active'">
                                    <a class="page-link"
                                        th:href="@{/master/cell(page=${cells.totalPages - 1},size=${cells.size},wingId=${wingId},includeInactive=${includeInactive},searchText=${searchText})}"
                                        th:text="${cells.totalPages}">2</a>
                                </li>
                                <li class="page-item" th:classappend="${cells.last} ? ' disabled'">
                                    <a class="page-link"
                                        th:href="@{/master/cell(page=${cells.number + 1},size=${cells.size},wingId=${wingId},includeInactive=${includeInactive},searchText=${searchText})}">Next</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
    </th:block>

    <script>
        document.querySelectorAll('.js-status-toggle').forEach(function (link) {
            link.addEventListener('click', function (event) {
                var action = link.getAttribute('data-status') || 'update';
                var message = 'Are you sure you want to ' + action + ' this cell?';
                if (window.Swal) {
                    event.preventDefault();
                    Swal.fire({
                        title: 'Confirm status change',
                        text: message,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonText: 'Yes',
                        cancelButtonText: 'Cancel'
                    }).then(function (result) {
                        if (result.isConfirmed) {
                            window.location.href = link.href;
                        }
                    });
                    return;
                }
                if (!window.confirm(message)) {
                    event.preventDefault();
                }
            });
        });
    </script>
</body>

</html>
