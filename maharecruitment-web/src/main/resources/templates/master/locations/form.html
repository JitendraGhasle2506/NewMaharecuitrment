<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Edit Location' : 'Add Location'">Location Master Form</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" th:href="@{/css/location-master.css(v='20260701')}">
</head>

<body>
    <th:block th:replace="~{header/header :: var-sidebar-header('Master', 'Location Master', ~{::section})}">
        <section>
            <div class="card add-emp-card">
                <div class="header">
                    <h2 th:text="${isEdit} ? 'Edit Location' : 'Add Location'"></h2>
                </div>
                <div class="card-body">
                    <div class="d-flex flex-wrap gap-2 mb-3">
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/resource-levels}">Resource Levels</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/designations}">Designations</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/designation-rates}">Designation Rates</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/projects}">Projects</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/wings}">Wing Master</a>
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/master/cell}">Cell Master</a>
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/master/locations}">Location Master</a>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:object="${locationForm}"
                        th:action="${isEdit} ? @{/master/locations/{id}(id=${locationId})} : @{/master/locations}"
                        method="post" class="row g-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="col-md-6">
                            <label class="form-label" for="officeName">Office Name</label>
                            <input type="text" id="officeName" th:field="*{officeName}" class="form-control"
                                maxlength="150" autocomplete="off">
                            <div class="text-danger small" th:if="${#fields.hasErrors('officeName')}"
                                th:errors="*{officeName}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="locationName">Location Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="text" id="locationName" th:field="*{locationName}" class="form-control"
                                    maxlength="150" required autocomplete="off">
                                <button class="btn btn-outline-primary" id="findLocationOnMap" type="button">
                                    <i class="fa-solid fa-magnifying-glass-location me-1" aria-hidden="true"></i>
                                    Find
                                </button>
                            </div>
                            <div id="locationSearchResults" class="location-search-results d-none" role="listbox"
                                aria-label="Location search results"></div>
                            <div class="text-danger small" th:if="${#fields.hasErrors('locationName')}"
                                th:errors="*{locationName}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label" for="latitude">Latitude <span class="text-danger">*</span></label>
                            <input type="number" id="latitude" th:field="*{latitude}" class="form-control"
                                min="-90" max="90" step="0.0000001" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('latitude')}"
                                th:errors="*{latitude}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label" for="longitude">Longitude <span class="text-danger">*</span></label>
                            <input type="number" id="longitude" th:field="*{longitude}" class="form-control"
                                min="-180" max="180" step="0.0000001" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('longitude')}"
                                th:errors="*{longitude}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label" for="activeFlag">Status</label>
                            <select id="activeFlag" class="form-select" th:field="*{activeFlag}">
                                <option value="Y">Active</option>
                                <option value="N">Inactive</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <div class="location-map-shell">
                                <div id="locationMap" class="location-map"
                                    role="application"
                                    aria-label="Location map selector"></div>
                                <div class="location-map-toolbar">
                                    <span id="locationMapStatus" class="location-map-status" aria-live="polite"></span>
                                    <span id="locationSelectedAddress" class="location-selected-address"></span>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Update' : 'Save'"></button>
                            <button type="reset" class="btn btn-outline-secondary">Reset</button>
                            <a th:href="@{/master/locations}" class="btn btn-outline-secondary">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </th:block>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script th:src="@{/js/location-master-form.js(v='20260701')}" defer></script>
</body>

</html>
