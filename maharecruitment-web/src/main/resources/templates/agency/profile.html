<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Agency Profile</title>
<style>
.section-header {
	margin-top: 1rem;
	margin-bottom: 1rem;
	font-weight: 600;
}

.sensitive-identifier-card {
	height: 100%;
	padding: 0.9rem;
	border: 1px solid var(--panel-border, #d4dee8);
	border-radius: 0.75rem;
	background: var(--surface-soft, #f8fafc);
}

.sensitive-identifier-heading {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 0.75rem;
	margin-bottom: 0.45rem;
}

.sensitive-identifier-heading .form-label {
	margin-bottom: 0;
}

.sensitive-identifier-control {
	display: flex;
	align-items: center;
	overflow: hidden;
	border: 1px solid var(--panel-border, #d4dee8);
	border-radius: 0.5rem;
	background: #fff;
}

.sensitive-identifier-value {
	min-width: 0;
	flex: 1;
	padding: 0.625rem 0.75rem;
	font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
	font-weight: 700;
	letter-spacing: 0.08em;
	word-break: break-all;
}

.sensitive-identifier-toggle {
	width: 42px;
	height: 42px;
	display: inline-grid;
	place-items: center;
	flex: 0 0 auto;
	color: var(--primary, #1f4f78);
	border: 0;
	border-left: 1px solid var(--panel-border, #d4dee8);
	background: #f5f8fb;
}

.sensitive-identifier-toggle:hover,
.sensitive-identifier-toggle:focus-visible {
	color: #fff;
	background: var(--primary, #1f4f78);
}

.sensitive-identifier-toggle:focus-visible {
	outline: 2px solid var(--primary, #1f4f78);
	outline-offset: 2px;
}

.sensitive-identifier-footer {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 0.75rem;
	min-height: 1.75rem;
	margin-top: 0.45rem;
}

.sensitive-identifier-hint,
.sensitive-identifier-error {
	font-size: 0.72rem;
}

.sensitive-identifier-hint {
	color: var(--text-muted, #5f7287);
}

.sensitive-identifier-error {
	color: var(--danger, #b42318);
}

.sensitive-document-button {
	padding: 0;
	font-size: 0.75rem;
	font-weight: 700;
}
</style>
<th:block th:replace="~{header/header :: var-files-header}"></th:block>
</head>

<body>
	<th:block
		th:replace="~{header/header :: var-sidebar-header('Agency', 'Profile', ~{::section})}">
		<section>
			<div class="card shadow-sm border-0">
				<div
					class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
					<h5 class="mb-0">Agency Profile</h5>
					<!--  <a class="btn btn-outline-secondary btn-sm" th:href="@{/agency/dashboard}">
                        Back to Dashboard
                    </a> -->
				</div>
				<div class="card-body">
					<form autocomplete="off" id="agencyProfileForm" th:object="${agencyMasterResponse}"
						th:data-sensitive-reveal-url="@{/agency/profile/sensitive-identifiers}"
						method="post" enctype="multipart/form-data">
						<input autocomplete="off" type="hidden" th:name="${_csrf.parameterName}"
							th:value="${_csrf.token}">

						<!-- ============== SECTION 1: AGENCY BASIC DETAILS ============== -->
						<div class="section-header">1. Agency Basic Details</div>

						<div class="row g-3">
							<div class="col-md-4">
								<label class="form-label">Agency Name </label> <label
									class="form-control" th:text="*{agencyName}"></label>
							</div>

							<div class="col-md-4">
								<label class="form-label">Official Email ID</label> <label
									class="form-control" th:text="*{officialEmail}"></label>
							</div>

							<div class="col-md-4">
								<label class="form-label">Telephone Number </label> <label
									class="form-control" th:text="*{telephoneNumber}"></label>
							</div>

							<div class="col-md-4">
								<label class="form-label">Agency Type </label> <label
									class="form-control" th:text="*{agencyType}"></label>
							</div>

							<div class="col-md-4">
								<label class="form-label">Entity Type</label> <label
									class="form-control" th:text="*{entityType}"></label>
							</div>

							<div class="col-md-4">
								<label class="form-label">MSME Registered </label> <label
									class="form-control" th:text="*{msmeRegistered} ? 'Yes' : 'No'"></label>
							</div>

							<div class="col-md-6">
								<label class="form-label">Official Address </label> <label
									class="form-control" rows="3" th:text="*{officialAddress}"></label>
							</div>

							<div class="col-md-6">
								<label class="form-label">Permanent Address </label> <label
									class="form-control" rows="3" th:text="*{permanentAddress}"></label>
							</div>


							<div class="col-md-4">
								<label class="form-label">Contact Person Name</label> <label
									class="form-control" th:text="*{contactPersonName}"></label>
							</div>

							<div class="col-md-4">
								<label class="form-label">Contact Person Mobile</label> <label
									class="form-control" th:text="*{contactPersonMobileNo}"></label>
							</div>

							<div class="col-md-4"></div>

							<!-- Sensitive identifiers: masked in the initial response and revealed on demand. -->
							<div class="col-md-4">
								<div class="sensitive-identifier-card">
									<div class="sensitive-identifier-heading">
										<label class="form-label" for="panNumberDisplay">PAN Number</label>
										<span class="badge text-bg-light border">Protected</span>
									</div>
									<div class="sensitive-identifier-control">
										<span id="panNumberDisplay" class="sensitive-identifier-value text-uppercase"
											data-sensitive-display="PAN" th:data-masked-value="*{panNumber}"
											th:text="*{panNumber ?: '-'}" aria-live="polite"></span>
										<button type="button" class="sensitive-identifier-toggle" data-sensitive-toggle="PAN"
											aria-controls="panNumberDisplay" aria-pressed="false"
											aria-label="Show full PAN number" title="Show full PAN number">
											<i class="fa-solid fa-eye" aria-hidden="true"></i>
										</button>
									</div>
									<div class="sensitive-identifier-footer">
										<span class="sensitive-identifier-hint">Only the last 4 characters are shown</span>
										<button type="button" class="btn btn-link sensitive-document-button"
											th:data-path="*{panCopyPath}" onclick="viewDocument(this.dataset.path)">
											<i class="fa-solid fa-file-pdf me-1" aria-hidden="true"></i>View document
										</button>
									</div>
									<div class="sensitive-identifier-error" data-sensitive-error="PAN" role="status"></div>
								</div>
							</div>

							<div class="col-md-4">
								<div class="sensitive-identifier-card">
									<div class="sensitive-identifier-heading">
										<label class="form-label" for="gstNumberDisplay">GST Number</label>
										<span class="badge text-bg-light border">Protected</span>
									</div>
									<div class="sensitive-identifier-control">
										<span id="gstNumberDisplay" class="sensitive-identifier-value text-uppercase"
											data-sensitive-display="GST" th:data-masked-value="*{gstNumber}"
											th:text="*{gstNumber ?: '-'}" aria-live="polite"></span>
										<button type="button" class="sensitive-identifier-toggle" data-sensitive-toggle="GST"
											aria-controls="gstNumberDisplay" aria-pressed="false"
											aria-label="Show full GST number" title="Show full GST number">
											<i class="fa-solid fa-eye" aria-hidden="true"></i>
										</button>
									</div>
									<div class="sensitive-identifier-footer">
										<span class="sensitive-identifier-hint">Only the last 4 characters are shown</span>
										<button type="button" class="btn btn-link sensitive-document-button"
											th:data-path="*{gstDocumentPath}" onclick="viewDocument(this.dataset.path)">
											<i class="fa-solid fa-file-pdf me-1" aria-hidden="true"></i>View document
										</button>
									</div>
									<div class="sensitive-identifier-error" data-sensitive-error="GST" role="status"></div>
								</div>
							</div>

							<div class="col-md-4">
								<div class="sensitive-identifier-card">
									<div class="sensitive-identifier-heading">
										<label class="form-label" for="certificateNumberDisplay">Certificate of Incorporation Number</label>
										<span class="badge text-bg-light border">Protected</span>
									</div>
									<div class="sensitive-identifier-control">
										<span id="certificateNumberDisplay" class="sensitive-identifier-value"
											data-sensitive-display="CERTIFICATE" th:data-masked-value="*{certificateNumber}"
											th:text="*{certificateNumber ?: '-'}" aria-live="polite"></span>
										<button type="button" class="sensitive-identifier-toggle" data-sensitive-toggle="CERTIFICATE"
											aria-controls="certificateNumberDisplay" aria-pressed="false"
											aria-label="Show full Certificate of Incorporation number"
											title="Show full Certificate of Incorporation number">
											<i class="fa-solid fa-eye" aria-hidden="true"></i>
										</button>
									</div>
									<div class="sensitive-identifier-footer">
										<span class="sensitive-identifier-hint">Only the last 4 characters are shown</span>
										<button type="button" class="btn btn-link sensitive-document-button"
											th:data-path="*{certificateDocumentPath}" onclick="viewDocument(this.dataset.path)">
											<i class="fa-solid fa-file-pdf me-1" aria-hidden="true"></i>View document
										</button>
									</div>
									<div class="sensitive-identifier-error" data-sensitive-error="CERTIFICATE" role="status"></div>
								</div>
							</div>
						</div>
						<div class="col-12">
							<hr>
						</div>
						<!-- ============== SECTION 2: ESCALATION MATRIX ============== -->
						<div class="section-header">2. Escalation Matrix</div>

						<div class="border rounded p-3 mb-4">
							<div class="table-responsive">
								<table
									class="table table-bordered table-hover align-middle mb-2"
									id="escalationTable">
									<thead class="table-light">
										<tr>
											<th style="width: 60px;">Sr No</th>
											<th>Name <span class="required-asterisk">*</span></th>
											<th>Mobile <span class="required-asterisk">*</span></th>
											<th style="width: 100px;">Level <span
												class="required-asterisk">*</span></th>
											<th>Designation</th>
											<th>Company Email</th>
										</tr>
									</thead>
									<tbody id="escalationTBody">
										<tr th:each="entry, rowStat : *{escalationMatrixEntries}">
											<td th:text="${rowStat.count}"></td>
											<td th:text="${entry.contactName}"></td>
											<td th:text="${entry.mobileNumber}"></td>
											<td th:text="${entry.level}"></td>
											<td th:text="${entry.designation}"></td>
											<td th:text="${entry.companyEmailId}"></td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
						<div class="col-12">
							<hr>
						</div>
						<!-- ============== SECTION 3: BANK DETAILS ============== -->
						<div class="section-header">3. Bank Account Details</div>

						<div class="row g-3">
							<div class="col-md-4">
								<label class="form-label">Bank Name </label> <label
									class="form-control" th:text="*{bankName}"></label>
							</div>

							<div class="col-md-4">
								<label class="form-label">Branch </label> <label
									class="form-control" th:text="*{bankBranch}"></label>
							</div>

							<div class="col-md-4">
								<label class="form-label">Account Type </label> <label
									class="form-control" th:text="*{bankAccountType}"></label>
							</div>

							<div class="col-md-4">
								<label class="form-label">Account Number</label> <label
									class="form-control" th:text="*{bankAccountNumber}"></label>
							</div>

							<div class="col-md-4">
								<label class="form-label">IFSC Code </label> <label
									class="form-control text-uppercase" th:text="*{ifscCode}"></label>
							</div>

							<div class="col-md-4">
								<label class="form-label">Cancelled Cheque <span
									class="required-asterisk">*</span></label><label class="form-control">
									<button type="button"
										class="btn btn-link btn-sm p-0 text-decoration-none"
										th:data-path="*{cancelledChequePath}"
										onclick="viewDocument(this.dataset.path)">
										<i class="bi bi-eye"></i> View
									</button>
								</label>
							</div>

						</div>

						<hr class="mt-4">
					</form>
				</div>

			</div>
		</section>
	</th:block>
	<script>
	   // 0. File Viewing Logic
        function viewDocument(path) {
            if (!path) return;
            const contextPath = '[[@{/}]]';
            const encodedPath = encodeURIComponent(btoa(path));
            const viewUrl = `${contextPath}documents/view?path=${encodedPath}`;
            window.open(viewUrl, '_blank');
        }
	  </script>
	<script th:src="@{/js/agency-profile.js(v='20260820-sensitive-identifiers')}"></script>
</body>

</html>
