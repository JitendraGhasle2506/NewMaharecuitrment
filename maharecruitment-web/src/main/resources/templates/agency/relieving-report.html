<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Relieving Report</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
</head>
<body class="agency-shell">
    <th:block th:replace="~{header/header :: var-sidebar-header('Reports', 'Employee Relieving Report', ~{::section})}">
        <section>
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 border-bottom d-flex align-items-center">
                    <i class="fas fa-file-alt text-primary fs-4 me-2"></i>
                    <h5 class="mb-0 fw-bold text-primary">Employee Relieving Report</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Employee ID</th>
                                    <th>Employee Name</th>
                                    <th>Resignation Date</th>
                                    <th>Exit Date</th>
                                    <th>Current Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="record : ${records}">
                                    <td class="ps-4 fw-semibold text-muted" th:text="${record.employeeCode != null ? record.employeeCode : 'N/A'}"></td>
                                    <td class="fw-bold" th:text="${record.employeeName}"></td>
                                    <td th:text="${record.resignDate != null ? #temporals.format(record.resignDate, 'dd-MM-yyyy') : '-'}"></td>
                                    <td th:text="${record.exitDate != null ? #temporals.format(record.exitDate, 'dd-MM-yyyy') : '-'}"></td>
                                    <td>
                                        <span class="badge bg-info-subtle text-info-emphasis rounded-pill px-3" th:text="${record.status}"></span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(records)}">
                                    <td colspan="5" class="text-center text-muted py-5">
                                        <i class="fas fa-inbox me-2 fs-4 d-block mb-2 text-black-50"></i>
                                        No relieving records found.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </th:block>
</body>
</html>
