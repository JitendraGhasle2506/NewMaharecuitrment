<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Relieving Report</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
</head>
<body class="agency-shell">
    <th:block th:replace="~{header/header :: var-sidebar-header('Reports', 'Employee Relieving Report', ~{::section})}">
        <section>
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-file-alt text-primary fs-4 me-2"></i>
                        <h5 class="mb-0 fw-bold text-primary">Employee Relieving Report</h5>
                    </div>
                    <div>
                        <a th:href="@{/agency/reports/relieving/export/pdf}" class="btn btn-sm btn-outline-danger me-2">
                            <i class="fas fa-file-pdf me-1"></i> PDF
                        </a>
                        <a th:href="@{/agency/reports/relieving/export/excel}" class="btn btn-sm btn-outline-success">
                            <i class="fas fa-file-excel me-1"></i> Excel
                        </a>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Employee ID</th>
                                    <th>Employee Name</th>
                                    <th>Resignation Date</th>
                                    <th>Exit Date</th>
                                    <th>Current Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="record : ${recordPage.content}">
                                    <td class="ps-4 fw-semibold text-muted" th:text="${record.employeeCode != null ? record.employeeCode : 'N/A'}"></td>
                                    <td class="fw-bold" th:text="${record.employeeName}"></td>
                                    <td th:text="${record.resignDate != null ? #temporals.format(record.resignDate, 'dd-MM-yyyy') : '-'}"></td>
                                    <td th:text="${record.exitDate != null ? #temporals.format(record.exitDate, 'dd-MM-yyyy') : '-'}"></td>
                                    <td>
                                        <span class="badge bg-info-subtle text-info-emphasis rounded-pill px-3" th:text="${record.status}"></span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(recordPage.content)}">
                                    <td colspan="5" class="text-center text-muted py-5">
                                        <i class="fas fa-inbox me-2 fs-4 d-block mb-2 text-black-50"></i>
                                        No relieving records found.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-between align-items-center p-3 border-top" th:if="${recordPage.totalPages > 1}">
                        <div class="text-muted small">
                            Showing <span th:text="${recordPage.number * recordPage.size + 1}"></span> to 
                            <span th:text="${(recordPage.number * recordPage.size + recordPage.size) > recordPage.totalElements ? recordPage.totalElements : (recordPage.number * recordPage.size + recordPage.size)}"></span> of 
                            <span th:text="${recordPage.totalElements}"></span> entries
                        </div>
                        <nav aria-label="Page navigation">
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item" th:classappend="${recordPage.first ? 'disabled' : ''}">
                                    <a class="page-link" th:href="@{/agency/reports/relieving(page=${recordPage.number - 1}, size=${recordPage.size})}">Previous</a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, recordPage.totalPages - 1)}" th:classappend="${recordPage.number == i ? 'active' : ''}">
                                    <a class="page-link" th:href="@{/agency/reports/relieving(page=${i}, size=${recordPage.size})}" th:text="${i + 1}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${recordPage.last ? 'disabled' : ''}">
                                    <a class="page-link" th:href="@{/agency/reports/relieving(page=${recordPage.number + 1}, size=${recordPage.size})}">Next</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
    </th:block>
</body>
</html>
