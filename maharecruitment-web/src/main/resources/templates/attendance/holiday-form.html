<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Holiday Form</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
    <style>
        .holiday-form-panel {
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.06);
            padding: 1.5rem;
            height: 100%;
        }

        .holiday-form-title {
            color: #17324d;
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 0.35rem;
        }

        .holiday-preview-list .list-group-item {
            border-left: 0;
            border-right: 0;
            padding-left: 0;
            padding-right: 0;
        }
    </style>
</head>
<body>
    <th:block th:replace="~{header/header :: var-sidebar-header('Common', 'Holiday Master', ~{::section})}">
        <section>
            <div class="card add-emp-card">
                <div class="header d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <div>
                        <h2 class="mb-1" th:text="${pageTitle}">Add Holiday</h2>
                    </div>
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <span class="badge px-3 py-2"
                            th:classappend="${isEditMode ? ' text-bg-warning' : ' text-bg-primary'}"
                            th:text="${isEditMode ? 'Edit Mode' : 'New Entry'}">
                            New Entry
                        </span>
                        <a th:href="@{/common/holidays}" class="btn btn-outline-secondary btn-sm">Back To List</a>
                    </div>
                </div>

                <div class="card-body">
                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <div class="row g-4 align-items-stretch">
                        <div class="col-xl-7">
                            <div class="holiday-form-panel">
                                <div class="holiday-form-title" th:text="${isEditMode ? 'Update Holiday Details' : 'Create Holiday Entry'}">
                                    Create Holiday Entry
                                </div>

                                <form th:action="@{/common/holidays/save}" th:object="${holiday}" method="post" class="row g-3">
                                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="hidden" th:field="*{id}">

                                    <div class="col-md-6">
                                        <label for="holidayDate" class="form-label">Holiday Date <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="holidayDate" th:field="*{holidayDate}" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Day Preview</label>
                                        <input type="text" class="form-control" th:value="${holidayDayLabel}" readonly>
                                    </div>

                                    <div class="col-12">
                                        <label for="holidayName" class="form-label">Holiday Name <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="holidayName" th:field="*{holidayName}" placeholder="Enter holiday name" maxlength="150" required>
                                    </div>

                                    <div class="col-12 d-flex flex-wrap justify-content-end gap-2 pt-2">
                                        <a th:href="@{/common/holidays}" class="btn btn-outline-secondary">Cancel</a>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fa fa-save me-1"></i>
                                            <span th:text="${isEditMode ? 'Update Holiday' : 'Save Holiday'}">Save Holiday</span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div class="col-xl-5">
                            <div class="holiday-form-panel">
                                <div class="holiday-form-title">Holiday Snapshot</div>

                                <div class="row g-3 mb-4">
                                    <div class="col-sm-6">
                                        <div class="border rounded-4 p-3 h-100 bg-light">
                                            <div class="small text-uppercase text-muted fw-semibold mb-1">Mode</div>
                                            <div class="fw-semibold" th:text="${isEditMode ? 'Editing Existing Holiday' : 'Creating New Holiday'}">Creating New Holiday</div>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="border rounded-4 p-3 h-100 bg-light">
                                            <div class="small text-uppercase text-muted fw-semibold mb-1">Configured Holidays</div>
                                            <div class="fw-semibold" th:text="${holidayCount}">0</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="border rounded-4 p-3 mb-4 bg-white">
                                    <div class="small text-uppercase text-muted fw-semibold mb-1">Selected Date Summary</div>
                                    <div class="fw-semibold" th:text="${holidayDayLabel}">Date not selected</div>
                                </div>

                                <div>
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h6 class="mb-0">Upcoming Or Recent Holidays</h6>
                                        <span class="badge text-bg-light border" th:text="${previewHolidays.size() + ' shown'}">0 shown</span>
                                    </div>
                                    <ul class="list-group list-group-flush holiday-preview-list">
                                        <li class="list-group-item" th:if="${#lists.isEmpty(previewHolidays)}">
                                            <div class="text-muted small">No holiday records are available yet.</div>
                                        </li>
                                        <li class="list-group-item" th:each="item : ${previewHolidays}">
                                            <div class="fw-semibold" th:text="${item.holidayName}">Holiday Name</div>
                                            <div class="small text-muted">
                                                <span th:text="${#temporals.format(item.holidayDate, 'dd MMM yyyy')}">07 May 2026</span>
                                                <span class="mx-1">|</span>
                                                <span th:text="${#temporals.format(item.holidayDate, 'EEEE')}">Thursday</span>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </th:block>
</body>
</html>
