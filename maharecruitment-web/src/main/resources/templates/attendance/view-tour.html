<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tour History | Attendance System</title>
    <th:block th:replace="~{header/header :: var-files-header}"></th:block>
    <link th:href="@{/assets/css/fonts/inter.css}" rel="stylesheet">
    <style>
        :root {
            --primary-dark: linear-gradient(180deg, #1f4f78, #163a59);
            --button-bg: #1f4f78;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            color: #2d3436;
        }

        .history-card {
            max-width: 98%;
            margin: 20px auto;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            border: none;
            overflow: hidden;
            background: var(--glass-bg);
        }

        .card-header-premium {
            background: var(--primary-dark);
            padding: 20px 30px;
            position: relative;
        }

        .card-header-premium h4 {
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }

        .card-header-premium .btn-back {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 8px 16px;
            transition: all 0.3s ease;
        }

        .table thead th {
            background-color: #f8f9fa;
            color: #636e72;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            border-top: none;
            padding: 15px 20px;
        }

        .table tbody td {
            padding: 18px 20px;
            font-size: 0.9rem;
            color: #2d3436;
            border-bottom: 1px solid #f1f2f6;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            display: inline-block;
            text-align: center;
            min-width: 90px;
        }

        .badge-pending {
            background-color: #fff9db;
            color: #f08c00;
            border: 1px solid #ffe066;
        }

        .badge-approved {
            background-color: #ebfbee;
            color: #37b24d;
            border: 1px solid #b2f2bb;
        }

        .badge-rejected {
            background-color: #fff5f5;
            color: #f03e3e;
            border: 1px solid #ffc9c9;
        }

        .sl-no-circle {
            width: 28px;
            height: 28px;
            background: #f1f2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1f4f78;
        }

        .approval-flow {
            display: flex; align-items: center; justify-content: center; width: max-content;
            min-width: 78px; margin: 0 auto; padding: 8px 0;
        }
        .approval-node { position: relative; display: flex; align-items: center; min-width: 0; }
        .approval-node + .approval-node::before { content: ''; width: 38px; height: 2px; margin: 0 6px; background: #ced4da; }
        .approval-dot {
            width: 13px; height: 13px; flex: 0 0 13px;
            border: 2px solid #fff; border-radius: 50%; background: #adb5bd;
            box-shadow: 0 0 0 2px #adb5bd; cursor: help;
        }
        .approval-dot:focus { outline: 2px solid #1f4f78; outline-offset: 3px; }
        .approval-node.is-approved .approval-dot { background: #40c057; box-shadow: 0 0 0 2px #40c057; }
        .approval-node.is-pending .approval-dot { background: #fab005; box-shadow: 0 0 0 2px #fab005; }
        .approval-node.is-rejected .approval-dot { background: #fa5252; box-shadow: 0 0 0 2px #fa5252; }
        .approval-node.is-waiting .approval-dot { background: #adb5bd; box-shadow: 0 0 0 2px #adb5bd; }
        .approval-tooltip {
            position: absolute; z-index: 20; bottom: calc(100% + 12px); left: 0; display: none;
            width: max-content; max-width: 260px; padding: 9px 11px; border-radius: 7px;
            background: #263238; color: #fff; font-size: 0.72rem; line-height: 1.45;
            white-space: normal; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
        }
        .approval-tooltip::after {
            content: ''; position: absolute; top: 100%; left: 9px; border: 6px solid transparent;
            border-top-color: #263238;
        }
        .approval-node:last-child .approval-tooltip { right: 0; left: auto; }
        .approval-node:last-child .approval-tooltip::after { right: 1px; left: auto; }
        .approval-node:hover .approval-tooltip, .approval-node:focus-within .approval-tooltip { display: block; }
        .tooltip-role { display: block; color: #b0bec5; font-size: 0.64rem; font-weight: 700; text-transform: uppercase; }
        .tooltip-name { display: block; font-weight: 700; }
        .tooltip-remarks { display: block; margin-top: 3px; color: #eceff1; }
        @media (max-width: 767.98px) {
            .approval-flow { min-width: 64px; }
            .approval-node + .approval-node::before { width: 28px; margin: 0 5px; }
            .approval-tooltip { top: calc(100% + 12px); bottom: auto; max-width: 210px; }
            .approval-tooltip::after {
                top: auto; bottom: 100%; border-top-color: transparent; border-bottom-color: #263238;
            }
        }
    </style>
</head>

<body>
    <th:block th:replace="~{header/header :: var-sidebar-header('Tour History', 'Employee Corner', ~{::section})}">
        <section>
            <div class="container-fluid pb-5">
                <div class="card history-card">
                    <div class="card-header-premium d-flex justify-content-between align-items-center">
                        <h4 class="mb-0"><i class="fa fa-history me-3"></i>My Tour Applications</h4>
                        <a th:href="@{/employee/applyTour}" class="btn btn-back">
                            <i class="fa fa-arrow-left me-2"></i>Back to Apply
                        </a>
                    </div>
                    
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-4">Sl.no.</th>
                                        <th>Tour Category</th>
                                        <th class="text-center">Dates (From - To)</th>
                                        <th>Description</th>
                                        <th>Approval Progress</th>
                                        <th class="pe-4 text-center">Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${tourHistory == null || tourHistory.isEmpty()}">
                                        <td colspan="6" class="text-center text-muted p-5">
                                            <div class="py-4">
                                                <i class="fa fa-folder-open fa-3x mb-3 d-block text-light-grey" style="color: #dee2e6;"></i>
                                                <p class="mb-0 fw-medium">No tour applications found in your history.</p>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:each="tour, iterStat : ${tourHistory}">
                                        <td class="ps-4">
                                            <div class="sl-no-circle" th:text="${iterStat.count}"></div>
                                        </td>
                                        <td class="fw-medium">
                                            <span th:text="${tour.tourCategory}"></span>
                                            <small class="text-muted d-block" th:if="${tour.tourCategory == 'Half Day'}" th:text="'(' + ${tour.timePeriod} + ')'"></small>
                                        </td>
                                        <td class="text-center">
                                            <div class="d-flex align-items-center justify-content-center" th:if="${tour.tourCategory == 'Full Day'}">
                                                <span th:text="${#temporals.format(tour.startDate, 'dd-MM-yyyy')}"></span>
                                                <i class="fa fa-long-arrow-alt-right mx-2 text-muted"></i>
                                                <span th:text="${#temporals.format(tour.endDate, 'dd-MM-yyyy')}"></span>
                                            </div>
                                            <div class="d-flex align-items-center justify-content-center" th:if="${tour.tourCategory == 'Half Day'}">
                                                <span th:text="${#temporals.format(tour.startDate, 'dd-MM-yyyy')}"></span>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="description-text" th:text="${tour.description ?: '-'}"></div>
                                        </td>
                                        <td>
                                            <div class="approval-flow" th:if="${tour.approvalStage != null}">
                                                <div class="approval-node"
                                                     th:if="${tour.managerApproverUserId != null and tour.managerApproverUserId != tour.hodApproverUserId}"
                                                     th:classappend="${tour.approvalStage == 'HOD' ? 'is-approved' : (tour.status == 'REJECTED' ? 'is-rejected' : 'is-pending')}">
                                                    <span class="approval-dot" tabindex="0" title="View Reporting Manager approval details"></span>
                                                    <span class="approval-tooltip" role="tooltip">
                                                        <span class="tooltip-role">Reporting Manager</span>
                                                        <span class="tooltip-name" th:text="${tour.managerApproverName ?: 'Reporting Manager'}"></span>
                                                        <span th:text="${tour.approvalStage == 'HOD' ? 'Status: Approved' : (tour.status == 'REJECTED' ? 'Status: Rejected' : 'Status: Approval pending')}"></span>
                                                        <span class="tooltip-remarks" th:if="${not #strings.isEmpty(tour.managerRemarks)}" th:text="${'Remarks: ' + tour.managerRemarks}"></span>
                                                    </span>
                                                </div>

                                                <div class="approval-node"
                                                     th:classappend="${tour.approvalStage == 'MANAGER' ? 'is-waiting' : (tour.status == 'APPROVED' or tour.status == 'ACCEPTED' ? 'is-approved' : (tour.status == 'REJECTED' ? 'is-rejected' : 'is-pending'))}">
                                                    <span class="approval-dot" tabindex="0" title="View Reporting HOD approval details"></span>
                                                    <span class="approval-tooltip" role="tooltip">
                                                        <span class="tooltip-role">Reporting HOD</span>
                                                        <span class="tooltip-name" th:text="${tour.hodApproverName ?: 'Reporting HOD'}"></span>
                                                        <span th:text="${tour.approvalStage == 'MANAGER' ? (tour.status == 'REJECTED' ? 'Status: Not required' : 'Status: Waiting for Manager approval') : (tour.status == 'APPROVED' or tour.status == 'ACCEPTED' ? 'Status: Approved' : (tour.status == 'REJECTED' ? 'Status: Rejected' : 'Status: Approval pending'))}"></span>
                                                        <span class="tooltip-remarks" th:if="${not #strings.isEmpty(tour.hodRemarks)}" th:text="${'Remarks: ' + tour.hodRemarks}"></span>
                                                    </span>
                                                </div>
                                            </div>
                                            <span class="small text-muted"
                                                  th:if="${tour.approvalStage == null}">Existing approval process</span>
                                        </td>
                                        <td class="pe-4 text-center">
                                            <span class="status-badge badge-pending" th:if="${tour.status == 'PENDING'}">
                                                <i class="fa fa-clock me-1"></i> Pending
                                            </span>
                                            <span class="status-badge badge-approved" th:if="${tour.status == 'APPROVED' or tour.status == 'ACCEPTED'}">
                                                <i class="fa fa-check-circle me-1"></i> Approved
                                            </span>
                                            <span class="status-badge badge-rejected" th:if="${tour.status == 'REJECTED'}">
                                                <i class="fa fa-times-circle me-1"></i> Rejected
                                            </span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </th:block>
</body>
</html>
