# Keep every internal module in the same DevTools restart classloader.
# Otherwise cross-module JPA associations can resolve duplicate Class instances
# after a hot restart (for example AssetAllocationEntity -> EmployeeEntity).
restart.include.maharecruitment-classes=/maharecruitment-[^/]+/(target/classes|bin|out)/
restart.include.maharecruitment-jars=/maharecruitment-[^/]+-[^/]+\\.jar
