# Opt in only on an existing database with a complete, verified entity-schema baseline.
# For example: --spring.profiles.active=local,schema-validate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=false
app.post-schema-flyway.enabled=true
app.post-schema-flyway.before-hibernate=true
app.post-schema-flyway.repair-on-validation-error=false
app.employee-master.schema-guard.enabled=false
app.pre-onboarding.schema-guard.enabled=false
app.recruitment.interview.schema-guard.enabled=false
